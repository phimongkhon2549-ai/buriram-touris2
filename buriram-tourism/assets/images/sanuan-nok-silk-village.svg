<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="silkGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="natureGreenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#natureGreenGrad)"/>
  <!-- Traditional Thai Wooden House & Silk Looms -->
  <polygon points="120,220 260,120 400,220" fill="#78350f"/>
  <rect x="150" y="220" width="220" height="130" fill="#451a03"/>
  <rect x="180" y="240" width="50" height="60" fill="#fef08a" opacity="0.6"/>
  <!-- Mulberry leaves / garden -->
  <circle cx="90" cy="270" r="60" fill="#15803d"/>
  <circle cx="480" cy="260" r="75" fill="#166534"/>
  <!-- Golden Silk skein -->
  <path d="M260,260 Q340,160 420,280 Q340,360 260,260 Z" fill="none" stroke="url(#silkGoldGrad)" stroke-width="12" stroke-linecap="round"/>
  <path d="M280,240 Q350,180 400,290" fill="none" stroke="#fde047" stroke-width="6"/>
  <!-- Badge -->
  <rect x="30" y="30" width="170" height="32" rx="16" fill="#eab308" fill-opacity="0.95"/>
  <text x="115" y="51" fill="#422006" font-family="'Prompt', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">ไหมสาวโบราณ รถอีแต๋น</text>
</svg>