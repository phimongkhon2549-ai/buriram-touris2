<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#c25e00"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="silkDyeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="40%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="#2d170a"/>
  <!-- Mountain Angkhan silhouette -->
  <path d="M0,280 Q150,140 320,240 Q480,180 600,270 L600,400 L0,400 Z" fill="#431407"/>
  <!-- Clay pot & cloth dyeing -->
  <ellipse cx="300" cy="330" rx="140" ry="40" fill="#1c0b05"/>
  <path d="M200,310 Q300,360 400,310 Q370,390 300,390 Q230,390 200,310 Z" fill="url(#terracottaGrad)"/>
  <!-- Silk Fabric draping from above -->
  <path d="M240,60 C260,180 230,220 270,320 C290,240 310,180 340,60 Z" fill="url(#silkDyeGrad)"/>
  <path d="M300,50 C320,160 300,200 330,300 C350,220 370,160 390,50 Z" fill="url(#silkDyeGrad)" opacity="0.85"/>
  <!-- Badge Label Motif -->
  <rect x="30" y="30" width="180" height="32" rx="16" fill="#f97316" fill-opacity="0.9"/>
  <text x="120" y="51" fill="#ffffff" font-family="'Prompt', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">ผ้าภูอัคนี ดินภูเขาไฟ</text>
</svg>