<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#091b30"/>
      <stop offset="40%" stop-color="#14365d"/>
      <stop offset="75%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="templeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#311905"/>
      <stop offset="100%" stop-color="#180b02"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background Sky & Sun -->
  <rect width="1200" height="630" fill="url(#skyGrad)"/>
  <circle cx="600" cy="310" r="180" fill="url(#sunGlow)"/>
  <circle cx="600" cy="310" r="45" fill="#fef9c3"/>

  <!-- Mountain Silhouettes (Khao Kradong & Angkhan) -->
  <path d="M-100,520 Q200,340 500,480 Q800,360 1300,520 L1300,630 L-100,630 Z" fill="#1b2a3d" opacity="0.6"/>
  <path d="M-50,560 Q350,420 750,530 Q1050,460 1250,580 L1250,630 L-50,630 Z" fill="#0d1c2d"/>

  <!-- Phanom Rung Khmer Temple Sanctuary Silhouette -->
  <!-- Base Terrace -->
  <rect x="420" y="470" width="360" height="35" rx="3" fill="url(#templeGrad)"/>
  <rect x="460" y="445" width="280" height="25" rx="2" fill="url(#templeGrad)"/>
  <!-- Central Prang Sanctuary -->
  <path d="M575,445 L575,320 Q575,250 600,210 Q625,250 625,320 L625,445 Z" fill="url(#templeGrad)"/>
  <!-- Prang Decorative tiers -->
  <rect x="560" y="380" width="80" height="12" rx="2" fill="url(#templeGrad)"/>
  <rect x="568" y="340" width="64" height="10" rx="2" fill="url(#templeGrad)"/>
  <rect x="576" y="300" width="48" height="8" rx="2" fill="url(#templeGrad)"/>
  <rect x="584" y="260" width="32" height="6" rx="1" fill="url(#templeGrad)"/>
  <polygon points="600,195 595,212 605,212" fill="#d97706"/>
  <!-- Side Mandapas / Porches -->
  <path d="M500,445 L500,380 Q515,350 530,380 L530,445 Z" fill="url(#templeGrad)"/>
  <path d="M670,445 L670,380 Q685,350 700,380 L700,445 Z" fill="url(#templeGrad)"/>
  
  <!-- Foreground Elements: Silk threads and rice stalk motif -->
  <path d="M0,580 Q300,530 600,590 T1200,560 L1200,630 L0,630 Z" fill="#080e18"/>
  <path d="M0,595 C250,560 450,620 700,585 C950,550 1100,610 1200,595 L1200,630 L0,630 Z" fill="#c25e00" opacity="0.35"/>
</svg>