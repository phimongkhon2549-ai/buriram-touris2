<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="stoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="#1e293b"/>
  <!-- Muang Tam Sanctuary Prangs -->
  <path d="M200,260 L200,160 Q215,110 230,160 L230,260 Z" fill="url(#stoneGrad)"/>
  <path d="M270,260 L270,120 Q290,70 310,120 L310,260 Z" fill="url(#stoneGrad)"/>
  <path d="M350,260 L350,160 Q365,110 380,160 L380,260 Z" fill="url(#stoneGrad)"/>
  <rect x="170" y="250" width="240" height="20" fill="#78350f"/>
  <!-- Ancient Baray Pool with Naga Motif & Lotus -->
  <rect x="0" y="270" width="600" height="130" fill="url(#waterGrad)"/>
  <!-- Lotus flowers in baray -->
  <ellipse cx="140" cy="330" rx="30" ry="12" fill="#047857"/>
  <path d="M140,325 Q130,305 140,295 Q150,305 140,325 Z" fill="#f43f5e"/>
  <ellipse cx="460" cy="340" rx="35" ry="14" fill="#047857"/>
  <path d="M460,335 Q450,315 460,305 Q470,315 460,335 Z" fill="#f43f5e"/>
  <!-- Badge -->
  <rect x="30" y="30" width="180" height="32" rx="16" fill="#b45309" fill-opacity="0.95"/>
  <text x="120" y="51" fill="#ffffff" font-family="'Prompt', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">ปราสาทเมืองต่ำ เสื่อกก</text>
</svg>